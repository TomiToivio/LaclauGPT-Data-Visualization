<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EP24 Merge Lab</title>
<style>
  :root {
    --bg: transparent;
    --card: #12161c;
    --card-2: #1b2230;
    --line: #2b3547;
    --ink: #e8eef7;
    --dim: #8fa0b8;
    --accent: #6ee7ff;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4px 2px 8px; background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .track { flex: 1; height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); transition: width .35s ease; }
  .count { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .milestone { color: var(--good); font-weight: 600; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px;
    cursor: grab; user-select: none; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    position: relative; min-height: 96px; display: flex; flex-direction: column; gap: 5px;
  }
  .card:hover { border-color: #3d4c66; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,231,255,.25); transform: translateY(-2px); }
  .card.over { border-color: var(--good); background: var(--card-2); transform: scale(1.02); }
  .card.dragging { opacity: .45; }
  .label { font-weight: 650; letter-spacing: .1px; }
  .meta { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .aliases { color: var(--dim); font-size: 12px; max-height: 34px; overflow: hidden; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--dim); margin-right: 4px;
  }
  .chip.cluster { color: var(--accent); border-color: #23445a; }
  .chip.review { color: var(--warn); border-color: #4a3c12; }
  .panel {
    position: sticky; bottom: 0; margin-top: 12px; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; display: none; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .panel.on { display: flex; }
  .panel input {
    flex: 1 1 220px; min-width: 160px; background: #0d1117; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit;
  }
  button {
    background: #22304a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 11px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #1f4d3a; border-color: #2c6b50; }
  button.danger { background: #4a1f24; border-color: #6b2c35; }
  .moves { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .help { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--dim); padding: 18px 4px; }
  kbd { background: #0d1117; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="track" aria-hidden="true"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="count" id="count">0 / 0</div>
    <div class="milestone" id="milestone"></div>
  </div>

  <div class="board" id="board" role="list" aria-label="Labels awaiting a decision"></div>

  <div class="panel" id="panel" role="region" aria-live="polite" aria-label="Merge preview">
    <div style="flex:1 1 100%">
      <div class="meta" id="panel-summary">Merge preview</div>
      <div class="aliases" id="panel-affected"></div>
    </div>
    <input id="panel-name" aria-label="Proposed canonical label" />
    <button class="primary" id="confirm">Confirm merge</button>
    <button class="danger" id="separate">Keep separate</button>
    <button id="cancel">Cancel</button>
  </div>

  <div class="moves">
    <button id="undo">↶ Undo</button>
    <button id="redo">Redo ↷</button>
  </div>
  <div class="help">
    Drag a card onto another to propose a merge. Keyboard: <kbd>Tab</kbd> to a card,
    <kbd>Enter</kbd> to pick up, <kbd>←</kbd>/<kbd>→</kbd> to choose the target, <kbd>Enter</kbd> to drop,
    <kbd>Esc</kbd> to cancel. Click-select works too.
  </div>

<script>
(function () {
  "use strict";

  var state = { category: "", cards: [], progress: { reviewed: 0, total: 0 }, can_undo: false, can_redo: false, milestone: "" };
  var picked = null;      // card id picked up
  var pending = null;     // {source, target} awaiting confirmation
  var sent = 0;           // nonce-ish counter, so a re-render does not replay an action

  function send(type, payload) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload || {}), "*");
  }
  function sendValue(value) {
    send("streamlit:setComponentValue", { value: value });
  }
  function resize() {
    send("streamlit:setFrameHeight", { height: Math.max(420, document.body.scrollHeight + 16) });
  }

  function cardId(card) { return card.id || card.label; }

  function cardById(id) {
    for (var i = 0; i < state.cards.length; i++) {
      if (cardId(state.cards[i]) === id) return state.cards[i];
    }
    return null;
  }

  function render() {
    var board = document.getElementById("board");
    board.innerHTML = "";
    if (!state.cards || !state.cards.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = state.message || "Nothing left to review in this category.";
      board.appendChild(empty);
    }
    (state.cards || []).forEach(function (card, index) {
      var node = document.createElement("div");
      node.className = "card" + (picked === cardId(card) ? " picked" : "");
      node.setAttribute("role", "listitem");
      node.setAttribute("tabindex", "0");
      node.setAttribute("draggable", "true");
      node.dataset.id = cardId(card);
      node.setAttribute("aria-label",
        card.label + ", " + (card.aliases ? card.aliases.length : 0) + " aliases, " + card.count +
        " occurrences. Press Enter to pick up for merging.");
      node.innerHTML =
        '<div><span class="chip ' + (card.kind === "cluster" ? "cluster" : "review") + '">' +
          (card.kind === "cluster" ? "merged" : "review") + "</span>" +
          '<span class="chip">' + (card.method || "") + "</span></div>" +
        '<div class="label"></div>' +
        '<div class="aliases"></div>' +
        '<div class="meta">' + (card.count || 0) + " occ · conf " + (card.confidence || 0).toFixed(2) + "</div>";
      node.querySelector(".label").textContent = card.label;
      node.querySelector(".aliases").textContent = (card.aliases || []).join(" · ");

      node.addEventListener("dragstart", function (event) {
        picked = cardId(card);
        node.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        try { event.dataTransfer.setData("text/plain", cardId(card)); } catch (e) {}
      });
      node.addEventListener("dragend", function () {
        node.classList.remove("dragging");
      });
      node.addEventListener("dragover", function (event) {
        if (picked && picked !== cardId(card)) { event.preventDefault(); node.classList.add("over"); }
      });
      node.addEventListener("dragleave", function () { node.classList.remove("over"); });
      node.addEventListener("drop", function (event) {
        event.preventDefault();
        node.classList.remove("over");
        var source = picked || (event.dataTransfer && event.dataTransfer.getData("text/plain"));
        if (source && source !== cardId(card)) propose(source, cardId(card));
      });

      node.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (!picked) { picked = cardId(card); render(); }
          else if (picked !== cardId(card)) { propose(picked, cardId(card)); }
          else { picked = null; render(); }
        } else if (event.key === "Escape") {
          picked = null; pending = null; renderPanel(); render();
        } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault();
          var step = event.key === "ArrowRight" ? 1 : -1;
          var next = state.cards[(index + step + state.cards.length) % state.cards.length];
          if (next) {
            var target = document.querySelector('[data-id="' + cardId(next).replace(/"/g, '\\"') + '"]');
            if (target) target.focus();
          }
        }
      });
      node.addEventListener("click", function () {
        if (!picked) { picked = cardId(card); render(); }
        else if (picked !== cardId(card)) { propose(picked, cardId(card)); }
        else { picked = null; render(); }
      });

      board.appendChild(node);
    });

    document.getElementById("count").textContent =
      state.progress.reviewed + " / " + state.progress.total + " reviewed";
    var pct = state.progress.total ? Math.round(100 * state.progress.reviewed / state.progress.total) : 0;
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("milestone").textContent = state.milestone || "";
    document.getElementById("undo").disabled = !state.can_undo;
    document.getElementById("redo").disabled = !state.can_redo;
    renderPanel();
    resize();
  }

  function propose(sourceId, targetId) {
    var source = cardById(sourceId), target = cardById(targetId);
    if (!source || !target) return;
    pending = { source: sourceId, target: targetId };
    picked = null;
    renderPanel();
    render();
  }

  function renderPanel() {
    var panel = document.getElementById("panel");
    if (!pending) { panel.classList.remove("on"); return; }
    var source = cardById(pending.source), target = cardById(pending.target);
    if (!source || !target) { pending = null; panel.classList.remove("on"); return; }
    panel.classList.add("on");
    var members = [source.label].concat(target.label);
    document.getElementById("panel-summary").textContent =
      "Merge " + (source.aliases || []).length + " + " + (target.aliases || []).length +
      " labels · " + ((source.count || 0) + (target.count || 0)) + " occurrences";
    document.getElementById("panel-affected").textContent = members.join("  +  ");
    var input = document.getElementById("panel-name");
    if (document.activeElement !== input) input.value = target.label;
  }

  document.getElementById("confirm").addEventListener("click", function () {
    if (!pending) return;
    var name = document.getElementById("panel-name").value.trim();
    var source = cardById(pending.source), target = cardById(pending.target);
    sendValue({ action: "merge", source: source.label, target: target.label, canonical: name, nonce: ++sent });
    pending = null;
  });
  document.getElementById("separate").addEventListener("click", function () {
    if (!pending) return;
    var source = cardById(pending.source), target = cardById(pending.target);
    sendValue({ action: "keep_separate", source: source.label, target: target.label, nonce: ++sent });
    pending = null;
  });
  document.getElementById("cancel").addEventListener("click", function () {
    pending = null; renderPanel();
  });
  document.getElementById("undo").addEventListener("click", function () {
    sendValue({ action: "undo", nonce: ++sent });
  });
  document.getElementById("redo").addEventListener("click", function () {
    sendValue({ action: "redo", nonce: ++sent });
  });

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = data.args || {};
    try {
      state = typeof args.state === "string" ? JSON.parse(args.state) : (args.state || state);
    } catch (error) {
      state = { cards: [], progress: { reviewed: 0, total: 0 }, message: "State could not be read: " + error.message };
    }
    if (pending && (!cardById(pending.source) || !cardById(pending.target))) pending = null;
    render();
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  resize();
})();
</script>
</body>
</html>

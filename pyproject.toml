[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laclaugpt-data-visualization"
version = "0.1.0"
description = "Researcher-facing visualization module for LaclauGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{ name = "Tomi Toivio" }]
dependencies = [
  "networkx>=3,<4",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "plotly>=5.24,<7",
  "PyYAML>=6.0,<7",
  "streamlit>=1.57,<2",
  "streamlit-authenticator>=0.3,<1",
]

[project.optional-dependencies]
remote = [
  "pymongo>=4.6,<5",
  "redis>=5,<7",
  "boto3>=1.34,<2",
]
dev = [
  "pytest>=8,<9",
  "playwright>=1.50,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
laclaugpt-visualize = "laclaugpt_visualization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" as well as "." so `pytest` works in a plain checkout: the package lives under src/,
# and without this a developer must `pip install -e .` before any test can import it -- which
# PEP 668 blocks on a managed interpreter. CI installs the package anyway, so this only
# removes the local-only failure.
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Streamlit multipage scripts are named for the navigation label (`1_AI26_Multimethod_Explore.py`), which is
# not a valid Python module name by construction.
"src/laclaugpt_visualization/pages/*.py" = ["N999"]
# dashboards/pledge/pledge_dashboard.py is a verbatim copy of the script deployed from the
# presentation host. Restyling it here would make the backup differ from the code that runs.
"dashboards/pledge/pledge_dashboard.py" = ["C408", "BLE001"]
